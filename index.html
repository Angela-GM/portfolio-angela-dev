<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="author" content="Angela Garcia" />

    <!-- seo:start — replaced per page by scripts/prerender.mjs -->
    <title>Angela Garcia · Desarrolladora Frontend · Full Stack en Tarragona</title>
    <meta
      name="description"
      content="Angela Garcia, desarrolladora Frontend · Full Stack en Tarragona, en remoto. Construyo productos web de principio a fin, con el foco en el frontend."
    />
    <!-- seo:end -->

    <!-- Dark is the default; light only if the visitor chose it. Applied
         before the first paint so the page doesn't flash. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint; text shows in the fallback font until Inter arrives. -->
    <link
      id="font-inter"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
    />
    <!-- Switches the font stylesheet to "all" once loaded (instead of an
         onload="" attribute, which the Content Security Policy would block). -->
    <script>
      (function () {
        var l = document.getElementById("font-inter");
        var on = function () { l.media = "all"; };
        if (l.sheet) on(); else l.addEventListener("load", on);
      })();
    </script>
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
